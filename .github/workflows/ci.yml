name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev pkg-config
      - run: make
      - run: make test
